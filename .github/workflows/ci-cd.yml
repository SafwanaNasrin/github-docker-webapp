name: Docker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/github-docker-webapp:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/github-docker-webapp:latest \
            .

      - name: Run Docker container
        run: |
          docker run -d \
            -p 8080:80 \
            --name test-container \
            ${{ secrets.DOCKERHUB_USERNAME }}/github-docker-webapp:${{ github.sha }}

      - name: Test web application
        run: |
          sleep 5
          curl --fail http://localhost:8080

      - name: Stop test container
        if: always()
        run: |
          docker stop test-container || true
          docker rm test-container || true


  push:
    name: Push Image to Docker Hub
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/github-docker-webapp:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/github-docker-webapp:latest \
            .

      - name: Push commit image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/github-docker-webapp:${{ github.sha }}

      - name: Push latest image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/github-docker-webapp:latest
